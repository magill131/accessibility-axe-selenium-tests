<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us - Accessible sample page</title>
  <style>
    body { font-family: Arial, sans-serif; color: #1a1a1a; background: #ffffff; margin: 2rem; }
    a { color: #0b4f9c; }
    label { display: block; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a href="#contact">Contact form</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <h1>Contact us</h1>
    <img alt="A blue square used as the company logo"
         src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">

    <h2 id="contact">Send us a message</h2>
    <form action="#">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email">

      <button type="submit">Send message</button>
    </form>

    <h2 id="about">About us</h2>
    <p>We answer every message within two business days.</p>
  </main>

  <footer>
    <p>Sample page for accessibility testing.</p>
  </footer>
</body>
</html>
